name: Consumer shared CI

on:
  push:
    branches: [main, '**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: voko/gsoft-demo/.github/workflows/jfrog-npm-ci.yml@ci-v1
    with:
      project-key: gsoft
      npm-resolve-repo: gsoft-npm-dev-virtual
      npm-dev-repo: gsoft-npm-dev-local
      npm-staging-repo: gsoft-npm-staging-local
      build-name: globalsoft-consumer
